<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zankyo Script Hub</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    :root {
        --bg-1: #0a0e27;
        --bg-2: #131735;
        --card: #1a1f3a;
        --border: #2a3155;
        --text: #e8eaf6;
        --text-dim: #8b92b8;
        --accent-1: #667eea;
        --accent-2: #764ba2;
        --accent-glow: rgba(102, 126, 234, 0.4);
        --pink: #f5576c;
    }

    body {
        background: radial-gradient(ellipse at top, #1e1b4b 0%, var(--bg-1) 50%, #060818 100%);
        color: var(--text);
        min-height: 100vh;
        padding: 24px 16px 80px;
        line-height: 1.6;
    }

    .container { max-width: 1240px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 32px; }
    header h1 {
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        font-weight: 800;
        background: linear-gradient(135deg, #667eea 0%, #f5576c 50%, #f093fb 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -0.5px; margin-bottom: 8px;
        filter: drop-shadow(0 0 20px var(--accent-glow));
    }
    header p { color: var(--text-dim); font-size: 0.95rem; margin-bottom: 16px; }

    .tiktok-btn {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 10px 22px;
        background: linear-gradient(135deg, #000 0%, #25F4EE 100%);
        color: #fff; text-decoration: none; border-radius: 50px;
        font-weight: 600; font-size: 0.9rem;
        box-shadow: 0 4px 16px rgba(37, 244, 238, 0.3);
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .tiktok-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(37, 244, 238, 0.5); }
    .tiktok-btn svg { width: 18px; height: 18px; }

    .search-wrap { position: relative; margin-bottom: 24px; }
    .search-wrap::before {
        content: '🔍'; position: absolute; left: 18px; top: 50%;
        transform: translateY(-50%); font-size: 1.1rem; opacity: 0.6;
    }
    .search-input {
        width: 100%; padding: 14px 18px 14px 50px;
        background: rgba(26, 31, 58, 0.7);
        border: 1px solid var(--border); border-radius: 14px;
        color: var(--text); font-size: 0.95rem; outline: none;
        backdrop-filter: blur(10px); transition: all 0.2s;
    }
    .search-input::placeholder { color: var(--text-dim); }
    .search-input:focus { border-color: var(--accent-1); box-shadow: 0 0 0 4px var(--accent-glow); }

    .tabs {
        display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px;
        padding: 6px; background: rgba(26, 31, 58, 0.5);
        border-radius: 14px; border: 1px solid var(--border);
    }
    .tab-btn {
        flex: 1; min-width: 120px; padding: 11px 16px;
        background: transparent; border: none; border-radius: 10px;
        color: var(--text-dim); font-size: 0.9rem; font-weight: 600;
        cursor: pointer; transition: all 0.25s; white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text); background: rgba(102, 126, 234, 0.1); }
    .tab-btn.active {
        background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        color: #fff; box-shadow: 0 4px 14px var(--accent-glow);
    }

    .script-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 16px;
    }

    .script-card {
        background: linear-gradient(145deg, var(--card), var(--bg-2));
        border: 1px solid var(--border); border-radius: 16px;
        padding: 20px; display: flex; flex-direction: column; gap: 12px;
        position: relative; overflow: hidden;
        transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    }
    .script-card::before {
        content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent-1), var(--pink), transparent);
        opacity: 0; transition: opacity 0.3s;
    }
    .script-card:hover {
        transform: translateY(-4px); border-color: var(--accent-1);
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
    }
    .script-card:hover::before { opacity: 1; }

    .card-header { display: flex; align-items: center; gap: 12px; }
    .card-icon {
        font-size: 1.8rem; width: 52px; height: 52px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, rgba(102,126,234,0.15), rgba(245,87,108,0.15));
        border-radius: 12px; border: 1px solid var(--border); flex-shrink: 0;
    }
    .card-title { flex: 1; min-width: 0; }
    .card-name { font-weight: 700; font-size: 1rem; word-break: break-word; line-height: 1.3; }
    .card-category {
        font-size: 0.75rem; color: var(--text-dim);
        text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px;
    }

    .code-preview {
        background: rgba(10, 14, 39, 0.7);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        font-family: 'Courier New', monospace;
        font-size: 0.72rem;
        color: #a5b4d4;
        word-break: break-all;
        max-height: 90px;
        overflow: auto;
        line-height: 1.5;
        position: relative;
    }
    .code-preview::-webkit-scrollbar { width: 4px; height: 4px; }
    .code-preview::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .kw { color: #f5576c; }     /* loadstring */
    .fn { color: #667eea; }     /* HttpGet */
    .str { color: #10b981; }    /* string */
    .punc { color: #8b92b8; }   /* () */

    .card-actions { display: flex; gap: 8px; margin-top: auto; }
    .btn {
        flex: 1; padding: 11px; border: none; border-radius: 10px;
        font-weight: 600; font-size: 0.88rem; cursor: pointer;
        transition: all 0.2s; display: flex; align-items: center;
        justify-content: center; gap: 6px;
    }
    .btn-copy {
        background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        color: #fff; box-shadow: 0 4px 12px var(--accent-glow);
    }
    .btn-copy:hover { transform: translateY(-1px); box-shadow: 0 6px 18px var(--accent-glow); }
    .btn-copy:active { transform: scale(0.97); }
    .btn-copy.copied {
        background: linear-gradient(135deg, #10b981, #059669);
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }

    .status { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 1rem; }
    .status.error { color: #f5576c; }
    .status .spinner {
        display: inline-block; width: 32px; height: 32px;
        border: 3px solid var(--border); border-top-color: var(--accent-1);
        border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
        text-align: center; margin-top: 50px; padding-top: 24px;
        border-top: 1px solid var(--border); color: var(--text-dim); font-size: 0.85rem;
    }
    footer a { color: #25F4EE; text-decoration: none; font-weight: 600; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 600px) {
        body { padding: 16px 10px 60px; }
        .script-grid { grid-template-columns: 1fr; }
        .tab-btn { min-width: 90px; padding: 9px 12px; font-size: 0.82rem; }
        .card-icon { font-size: 1.5rem; width: 44px; height: 44px; }
    }
</style>
</head>
<body>
<div class="container">
    <header>
        <h1>⚡ ZANKYO SCRIPT HUB</h1>
        <p>Tổng hợp script mới nhất — Cập nhật liên tục</p>
        <a href="https://www.tiktok.com/@zankyo2114" target="_blank" rel="noopener" class="tiktok-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-5.2 1.74 2.89 2.89 0 012.31-4.64 2.93 2.93 0 01.88.13V9.4a6.84 6.84 0 00-1-.05A6.33 6.33 0 005 20.1a6.34 6.34 0 0010.86-4.43v-7a8.16 8.16 0 004.77 1.52v-3.4a4.85 4.85 0 01-1-.1z"/></svg>
            Theo dõi @zankyo2114
        </a>
    </header>

    <div class="search-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm script theo tên...">
    </div>

    <div id="tabsContainer" class="tabs"></div>
    <div id="contentContainer"></div>

    <footer>
        Made with 💜 by <a href="https://www.tiktok.com/@zankyo2114" target="_blank" rel="noopener">@zankyo2114</a>
        &nbsp;·&nbsp; Nhớ theo dõi TikTok nhé!
    </footer>
</div>

<script>
// ============================================================
// CẤU HÌNH
// ============================================================
const JSON_URL = 'https://raw.githubusercontent.com/bn130189-lgtm/Tong-hop-script/main/script.json';

let allData = {};
let currentCategory = '';
let searchKeyword = '';

// ============================================================
// ⭐ HÀM QUAN TRỌNG: Bọc URL thành loadstring nếu chưa có
// ============================================================
function buildLoadstring(url) {
    if (!url) return '';
    const trimmed = String(url).trim();

    // Đã là loadstring rồi → giữ nguyên
    if (/^loadstring\s*\(/i.test(trimmed)) return trimmed;

    // Đã có HttpGet nhưng chưa loadstring (vd: game:HttpGet("...")) → bọc nhẹ
    if (/HttpGet/i.test(trimmed) && !/^loadstring/i.test(trimmed)) {
        return `loadstring(${trimmed})()`;
    }

    // URL thuần → bọc đầy đủ
    if (/^https?:\/\//i.test(trimmed)) {
        return `loadstring(game:HttpGet("${trimmed}"))()`;
    }

    // Các trường hợp khác → trả nguyên
    return trimmed;
}

// ============================================================
// TÔ MÀU CÚ PHÁP Lua cho phần preview (đơn giản)
// ============================================================
function highlightLua(code) {
    const esc = escapeHtml(code);
    return esc
        .replace(/\b(loadstring|HttpGet|game)\b/g, '<span class="kw">$1</span>')
        .replace(/\b(getgenv|game)\b/g, '<span class="fn">$1</span>')
        .replace(/(&quot;[^&]*?&quot;)/g, '<span class="str">$1</span>');
}

// ============================================================
// ICON THEO DANH MỤC
// ============================================================
function pickIcon(category, index = 0) {
    const c = category.toLowerCase();
    if (c.includes('egg') || c.includes('steal')) return '🥚';
    if (c.includes('mm2') || c.includes('murder')) return '🔪';
    if (c.includes('blox') || c.includes('fruit')) return '🍇';
    if (c.includes('arsenal')) return '🔫';
    if (c.includes('adopt') || c.includes('pet')) return '🐾';
    if (c.includes('fish')) return '🎣';
    if (c.includes('tower')) return '🗼';
    if (c.includes('anime') || c.includes('fight')) return '⚔️';
    if (c.includes('sim') || c.includes('click')) return '👆';
    if (c.includes('grow') || c.includes('garden')) return '🌱';
    if (c.includes('obby') || c.includes('parkour')) return '🏃';
    if (c.includes('horror') || c.includes('scary')) return '👻';
    const defaults = ['📜', '⚡', '🔥', '✨', '🎯', '💎', '🌟', '🚀', '🎮', '🛡️'];
    return defaults[index % defaults.length];
}

// ============================================================
// TẢI DỮ LIỆU
// ============================================================
async function loadData() {
    const tabsContainer = document.getElementById('tabsContainer');
    const contentContainer = document.getElementById('contentContainer');

    contentContainer.innerHTML = '<div class="status"><div class="spinner"></div><div>Đang tải dữ liệu...</div></div>';

    try {
        const res = await fetch(JSON_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        allData = await res.json();

        const categories = Object.keys(allData);
        if (categories.length === 0) {
            contentContainer.innerHTML = '<div class="status">📭 Chưa có dữ liệu.</div>';
            return;
        }

        tabsContainer.innerHTML = categories.map((cat, i) => `
            <button class="tab-btn ${i === 0 ? 'active' : ''}" data-category="${escapeAttr(cat)}">
                ${pickIcon(cat)} ${escapeHtml(cat)}
            </button>
        `).join('');

        tabsContainer.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                tabsContainer.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                renderCategory(currentCategory, searchKeyword);
            });
        });

        currentCategory = categories[0];
        renderCategory(currentCategory, searchKeyword);

    } catch (err) {
        console.error(err);
        contentContainer.innerHTML = `<div class="status error">❌ Không tải được dữ liệu.<br><small>${escapeHtml(err.message)}</small></div>`;
    }
}

// ============================================================
// HIỂN THỊ
// ============================================================
function renderCategory(category, keyword = '') {
    const container = document.getElementById('contentContainer');
    const scripts = allData[category] || [];

    const filtered = keyword
        ? scripts.filter(s => (s.Name || '').toLowerCase().includes(keyword.toLowerCase()))
        : scripts;

    if (filtered.length === 0) {
        container.innerHTML = `<div class="status">🔎 Không có script nào${keyword ? ` khớp "${escapeHtml(keyword)}"` : ''}.</div>`;
        return;
    }

    const catIcon = pickIcon(category);

    const cards = filtered.map((s, i) => {
        const name = escapeHtml(s.Name || 'Không tên');
        const rawUrl = s.Url || '';
        const loadstring = buildLoadstring(rawUrl);   // ⭐ Bọc ở đây
        const icon = filtered.length > 1 ? pickIcon(category + ' ' + s.Name, i) : catIcon;
        const previewHtml = highlightLua(loadstring);
        return `
            <div class="script-card">
                <div class="card-header">
                    <div class="card-icon">${icon}</div>
                    <div class="card-title">
                        <div class="card-name">${name}</div>
                        <div class="card-category">${escapeHtml(category)}</div>
                    </div>
                </div>
                <div class="code-preview">${previewHtml}</div>
                <div class="card-actions">
                    <button class="btn btn-copy" data-code="${escapeAttr(loadstring)}">📋 Sao chép Script</button>
                </div>
            </div>
        `;
    }).join('');

    container.innerHTML = `<div class="script-grid">${cards}</div>`;

    container.querySelectorAll('.btn-copy').forEach(btn => {
        btn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(btn.dataset.code);
                btn.classList.add('copied');
                btn.textContent = '✅ Đã sao chép!';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.textContent = '📋 Sao chép Script';
                }, 1600);
            } catch {
                alert('Không sao chép được. Hãy copy thủ công từ phần preview.');
            }
        });
    });
}

// ============================================================
// TIỆN ÍCH
// ============================================================
function escapeHtml(str) {
    return String(str ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function escapeAttr(str) {
    return String(str ?? '').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

// ============================================================
// TÌM KIẾM
// ============================================================
document.getElementById('searchInput').addEventListener('input', e => {
    searchKeyword = e.target.value.trim();
    if (currentCategory) renderCategory(currentCategory, searchKeyword);
});

// ============================================================
// CHẠY
// ============================================================
loadData();
</script>
</body>
</html>
